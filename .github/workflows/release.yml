name: release

# Tag a commit (git tag v0.2.0 && git push origin v0.2.0) and this builds the app bundle,
# zips it and attaches it to a GitHub Release.
#
# The attached build is ad-hoc signed, not notarised: a downloaded copy is quarantined and
# needs System Settings › Privacy & Security › Open Anyway. Building from source with
# scripts/install.sh avoids that entirely, which is why the release notes point there.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # bundle.sh uses `git rev-list --count HEAD` as CFBundleVersion.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Test
        run: swift test

      - name: Build the app bundle
        run: ./scripts/bundle.sh release

      - name: Zip the bundle
        id: zip
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ZIP="Nook-${TAG}-macos.zip"
          # ditto, not `zip`: it keeps the bundle's symlinks and the code signature intact.
          ditto -c -k --sequesterRsrc --keepParent dist/Nook.app "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cat > notes.md <<'EOF'
          Nook for macOS 14 or later.

          **This build is not notarised.** macOS quarantines anything you download, so after
          unzipping you will need System Settings › Privacy & Security › *Open Anyway* the
          first time. Because the signature is ad-hoc and changes with every build, macOS also
          re-asks for microphone, screen recording and notification permission after each update.

          Building from source avoids both problems:

          ```
          curl -fsSL https://raw.githubusercontent.com/mikepackdraw/nook/main/scripts/install.sh | bash
          ```

          Nook runs your own Claude Code install; it needs `claude` on this Mac and logged in.
          See docs/INSTALL.md.
          EOF
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
            --title "Nook $TAG" --notes-file notes.md --verify-tag
